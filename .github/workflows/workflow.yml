name: PHP tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  php-tests:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php-versions: '7.3', laravel: '^8.0' }
          - { php-versions: '7.4', laravel: '^8.0' }
          - { php-versions: '8.0', laravel: '^9.0' }
          - { php-versions: '8.1', laravel: '^10.0' }
          - { php-versions: '8.2', laravel: '^11.0' }
          - { php-versions: '8.2', laravel: '^12.0' }
          - { php-versions: '8.3', laravel: '^12.0' }

    name: PHP ${{ matrix.php-versions }} / Laravel ${{ matrix.laravel }} tests

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php-versions }}
        extensions: mbstring, intl
        ini-values: post_max_size=256M, short_open_tag=On
        coverage: xdebug        
        tools: php-cs-fixer, phpunit

    - name: Validate composer.json and composer.lock
      run: composer validate

    - name: Install dependencies
      run: |
        composer require "laravel/framework:${{ matrix.laravel }}" --dev --no-update --no-interaction
        composer update --prefer-dist --no-progress --no-interaction
      
    - name: Execute PHPUnit tests
      run: vendor/bin/phpunit --configuration phpunit.xml

    - name: Upload coverage results to Codeclimate
      if: matrix.php-versions == '7.4'
      env:
        CC_TEST_REPORTER_ID: ${{ secrets.CC_TEST_REPORTER_ID }}
      run: |
        curl -L https://codeclimate.com/downloads/test-reporter/test-reporter-latest-linux-amd64 > ./cc-test-reporter
        chmod +x ./cc-test-reporter
        ./cc-test-reporter before-build
        vendor/bin/phpunit tests --coverage-clover build/logs/clover.xml
        ./cc-test-reporter after-build -t clover --exit-code $?


